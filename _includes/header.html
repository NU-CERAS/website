<header class="site-header">
  <div class="shell header-inner">
    {% include brand.html %}
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden><span>Menu</span><span class="menu-lines" aria-hidden="true"></span></button>
    <nav class="site-navigation" id="site-nav" aria-label="Main navigation">
      {% for item in site.data.navigation %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
    </nav>
  </div>
</header>

<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101214">
    {% seo %}
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body class="page-{{ page.page_class | default: 'standard' }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main class="shell site-main" id="main" tabindex="-1">{{ content }}</main>
    {% include footer.html %}
  </body>
</html>

as_of: Fall 2026
focus: Humanoid robot
summary: >-
  So far, we've simulated drumming motions and used dynamics analysis to determine
  dimensions and materials for a high-capability, dexterous arm. Our software team
  is building the software stack on the OpenArm platform, while our mechanical
  team is working through dynamics and linkage dimension calculations, with CAD
  and FEA starting soon.
